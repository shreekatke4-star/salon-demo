<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="32" fill="#0A0806"/>
  <!-- Outer ring accent -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#C8834A" stroke-width="2" opacity="0.4"/>
  <!-- Scissors icon (custom drawn in brand color) -->
  <!-- Left blade -->
  <ellipse cx="22" cy="24" rx="5" ry="5" fill="none" stroke="#C8834A" stroke-width="2.2"/>
  <line x1="25.5" y1="27" x2="38" y2="42" stroke="#C8834A" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right blade -->
  <ellipse cx="30" cy="24" rx="5" ry="5" fill="none" stroke="#C8834A" stroke-width="2.2"/>
  <line x1="26.5" y1="27" x2="18" y2="42" stroke="#C8834A" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Pivot screw dot -->
  <circle cx="26" cy="27" r="2" fill="#C8834A"/>
</svg>
